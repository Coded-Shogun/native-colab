version: '3.9'

# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ============================================
  # Backend (Development Mode)
  # ============================================
  backend:
    build:
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: debug
      AUTO_RELOAD: "true"
    volumes:
      - ./backend:/app
      - backend-dev-cache:/app/.cache

  # ============================================
  # Frontend (Development Mode)
  # ============================================
  frontend:
    build:
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      NODE_ENV: development
    stdin_open: true
    tty: true

  # ============================================
  # MailHog (Email Testing)
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: nativecolab-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_WEB_PORT:-8025}:8025"  # Web UI
      - "${MAILHOG_SMTP_PORT:-1025}:1025"  # SMTP
    networks:
      - nativecolab-network

  # ============================================
  # PostgreSQL (Development with pgAdmin)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nativecolab-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nativecolab.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - nativecolab-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  # ============================================
  # Redis Commander (Redis GUI)
  # ============================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: nativecolab-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - nativecolab-network

volumes:
  backend-dev-cache:
    driver: local
  pgadmin-data:
    driver: local
